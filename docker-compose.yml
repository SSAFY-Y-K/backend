version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: passit-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: passit
      MYSQL_USER: passit
      MYSQL_PASSWORD: passit1234
      TZ: Asia/Seoul
    volumes:
      - passit-mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "passit", "-ppassit1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  passit-mysql-data:
    driver: local
