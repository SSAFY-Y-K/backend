  <line x1="80" y1="142" x2="80" y2="170" stroke="#888780" stroke-width="1.8"/>
  <line x1="60" y1="152" x2="100" y2="152" stroke="#888780" stroke-width="1.8"/>
  <line x1="80" y1="170" x2="62" y2="188" stroke="#888780" stroke-width="1.8"/>
