  <ellipse cx="301" cy="148" rx="82" ry="20" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="301" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A">회원가입</text>

  <ellipse cx="301" cy="218" rx="82" ry="20" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="301" y="222" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A">로그인</text>

  <ellipse cx="301" cy="288" rx="82" ry="20" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
