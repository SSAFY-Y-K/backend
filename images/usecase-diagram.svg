  <!-- 문제 풀기 → 코드 문제 풀기 -->
  <line x1="510" y1="198" x2="730" y2="198" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-ext)"/>
  <rect x="578" y="183" width="52" height="16" rx="4" fill="#ffffff"/>
  <text x="604" y="195" text-anchor="middle" font-size="10" fill="#854F0B">«extend»</text>

  <!-- ===== 화살표 마커 ===== -->
  <defs>
    <marker id="arr-inc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
