  <!-- 문제 만들기 → AI 문제 자동 생성 -->
  <line x1="510" y1="268" x2="730" y2="338" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-inc)"/>
  <rect x="578" y="288" width="58" height="16" rx="4" fill="#ffffff"/>
  <text x="607" y="300" text-anchor="middle" font-size="10" fill="#534AB7">«include»</text>

  <!-- AI 문제 생성 요청 → AI 문제 자동 생성 -->
  <line x1="510" y1="338" x2="730" y2="338" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-inc)"/>
  <rect x="578" y="323" width="58" height="16" rx="4" fill="#ffffff"/>
  <text x="607" y="335" text-anchor="middle" font-size="10" fill="#534AB7">«include»</text>

  <!-- AI 문제 자동 생성 → 문제 품질 검수 -->
  <line x1="820" y1="348" x2="820" y2="398" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-inc)"/>
  <rect x="826" y="364" width="58" height="16" rx="4" fill="#ffffff"/>
  <text x="855" y="376" text-anchor="middle" font-size="10" fill="#534AB7">«include»</text>

