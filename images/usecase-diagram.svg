<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- 배경 -->
  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- 시스템 경계 -->
  <rect x="140" y="60" width="680" height="640" rx="16"
    fill="#f8f8ff" stroke="#9b97d4" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="480" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#534AB7">Pass-IT 시스템 경계</text>

  <!-- ===== 연결선 (액터 → 유스케이스) ===== -->
  <!-- 비회원 연결선 -->
  <line x1="80" y1="160" x2="220" y2="148" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="160" x2="220" y2="218" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="160" x2="220" y2="288" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="160" x2="220" y2="578" stroke="#b0b0b0" stroke-width="1"/>

  <!-- 회원 연결선 -->
  <line x1="80" y1="420" x2="390" y2="198" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="390" y2="268" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="390" y2="338" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="390" y2="408" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="390" y2="478" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="390" y2="548" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="390" y2="618" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="80" y1="420" x2="220" y2="578" stroke="#b0b0b0" stroke-width="1"/>

  <!-- 관리자 연결선 -->
  <line x1="920" y1="240" x2="820" y2="198" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="920" y1="240" x2="820" y2="128" stroke="#b0b0b0" stroke-width="1"/>

