  <line x1="80" y1="402" x2="80" y2="430" stroke="#1D9E75" stroke-width="1.8"/>
  <line x1="60" y1="412" x2="100" y2="412" stroke="#1D9E75" stroke-width="1.8"/>
  <line x1="80" y1="430" x2="62" y2="448" stroke="#1D9E75" stroke-width="1.8"/>
  <line x1="80" y1="430" x2="98" y2="448" stroke="#1D9E75" stroke-width="1.8"/>
  <text x="80" y="464" text-anchor="middle" font-size="12" font-weight="600" fill="#0F6E56">회원</text>

  <!-- ===== 액터: 관리자 ===== -->
  <circle cx="920" cy="210" r="12" fill="none" stroke="#D85A30" stroke-width="1.8"/>
  <line x1="920" y1="222" x2="920" y2="250" stroke="#D85A30" stroke-width="1.8"/>
  <line x1="900" y1="232" x2="940" y2="232" stroke="#D85A30" stroke-width="1.8"/>
  <line x1="920" y1="250" x2="902" y2="268" stroke="#D85A30" stroke-width="1.8"/>
  <line x1="920" y1="250" x2="938" y2="268" stroke="#D85A30" stroke-width="1.8"/>
  <text x="920" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#993C1D">관리자</text>

  <!-- ===== 액터: AI 시스템 ===== -->
  <circle cx="920" cy="470" r="12" fill="none" stroke="#7F77DD" stroke-width="1.8"/>
  <line x1="920" y1="482" x2="920" y2="510" stroke="#7F77DD" stroke-width="1.8"/>
  <line x1="900" y1="492" x2="940" y2="492" stroke="#7F77DD" stroke-width="1.8"/>
  <line x1="920" y1="510" x2="902" y2="528" stroke="#7F77DD" stroke-width="1.8"/>
  <line x1="920" y1="510" x2="938" y2="528" stroke="#7F77DD" stroke-width="1.8"/>
  <text x="920" y="544" text-anchor="middle" font-size="12" font-weight="600" fill="#534AB7">AI 시스템</text>

  <!-- ===== 범례 ===== -->
  <rect x="150" y="695" width="660" height="46" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>

  <ellipse cx="180" cy="718" rx="18" ry="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="204" y="722" font-size="11" fill="#444">회원 전용</text>

  <ellipse cx="280" cy="718" rx="18" ry="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="304" y="722" font-size="11" fill="#444">비회원 가능</text>

  <ellipse cx="390" cy="718" rx="18" ry="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="414" y="722" font-size="11" fill="#444">AI 관련</text>

  <ellipse cx="480" cy="718" rx="18" ry="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="504" y="722" font-size="11" fill="#444">관리자</text>

  <line x1="570" y1="718" x2="600" y2="718" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="607" y="722" font-size="11" fill="#444">«include»</text>

  <line x1="670" y1="718" x2="700" y2="718" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="707" y="722" font-size="11" fill="#444">«extend»</text>
