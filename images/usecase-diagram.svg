  <line x1="920" y1="500" x2="820" y2="338" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="920" y1="500" x2="820" y2="408" stroke="#b0b0b0" stroke-width="1"/>
  <line x1="920" y1="500" x2="820" y2="478" stroke="#b0b0b0" stroke-width="1"/>

