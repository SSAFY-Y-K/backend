services:
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: passit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  ai-server:
    image: ${AI_SERVER_IMAGE}
    container_name: passit-ai-server
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CHROMA_DIR: /opt/passit/ai/chroma_db
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-rag_chunks}
      RAG_TOP_K: ${RAG_TOP_K:-12}
      RAG_QUESTION_COUNT: ${RAG_QUESTION_COUNT:-20}
    expose:
      - "8000"
    volumes:
      - /opt/passit/ai/chroma_db:/opt/passit/ai/chroma_db

  backend:
    image: ${BACKEND_IMAGE}
    container_name: passit-backend
    restart: unless-stopped
    depends_on:
      - ai-server
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      JAVA_OPTS: ${JAVA_OPTS:-}
      DB_HOST: ${RDS_HOST}
      DB_PORT: ${RDS_PORT:-3306}
      DB_NAME: ${RDS_DB_NAME}
      DB_USERNAME: ${RDS_USERNAME}
      DB_PASSWORD: ${RDS_PASSWORD}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Seoul}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      AI_SERVER_URL: http://ai-server:8000
      AI_BASE_URL: http://ai-server:8000
      AI_SYSTEM_AUTHOR_ID: ${AI_SYSTEM_AUTHOR_ID:-1}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-admin}
      JUDGE_WORKSPACE_ROOT: /opt/passit/judge-workspaces
      JUDGE_PYTHON_IMAGE: ${JUDGE_PYTHON_IMAGE:-python:3.11-slim}
      JUDGE_JAVA_IMAGE: ${JUDGE_JAVA_IMAGE:-eclipse-temurin:21}
      JUDGE_CPP_IMAGE: ${JUDGE_CPP_IMAGE:-gcc:13}
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/passit/judge-workspaces:/opt/passit/judge-workspaces
