spring.application.name=passit
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:passit}?serverTimezone=${DB_TIMEZONE:Asia/Seoul}&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:passit}
spring.datasource.password=${DB_PASSWORD:passit1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=com.ssafy.passit
mybatis.configuration.map-underscore-to-camel-case=true

ai.server.url=${AI_SERVER_URL:http://127.0.0.1:8000}
ai.system.author-id=${AI_SYSTEM_AUTHOR_ID:1}
ai.base-url=${AI_BASE_URL:http://localhost:8000}

jwt.secret=${JWT_SECRET:passit-jwt-secret-key-passit-jwt-secret-key-2026}

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin1234}
admin.nickname=${ADMIN_NICKNAME:관리자}

judge.workspace-root=${JUDGE_WORKSPACE_ROOT:}
judge.image.python=${JUDGE_PYTHON_IMAGE:python:3.11-slim}
judge.image.java=${JUDGE_JAVA_IMAGE:eclipse-temurin:21}
judge.image.cpp=${JUDGE_CPP_IMAGE:gcc:13}
